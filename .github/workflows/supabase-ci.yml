name: supabase-ci

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'

jobs:
  rls-isolation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase start` runs the full local stack (Postgres/Auth/Storage/...)
      # via Docker, applies every migration in supabase/migrations, then
      # `test db` runs every pgTAP file in supabase/tests against it — the
      # exact same two commands documented in README.md for local dev.
      - run: supabase start
      - run: supabase test db
